<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f4ef">
<title>Igreja — Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Slab:wght@300;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#1b2f6b;--azul2:#2f6fd0;--ouro:#3aa0e6;--bg:#f4f5f7;--card:#fff;--txt:#1c2430;--mut:#6b7686;--borda:#e3e7ee;--ok:#1f8a4c;--warn:#b7791f;--err:#c0392b;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
.top{background:linear-gradient(135deg,#1c1c1e,#38383b);color:#fff;padding:14px 16px 11px;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--ouro)}
.top h1{margin:0;font-size:19px;font-weight:700}
.top h1,h2,.sheet-h h3,.pmh h2{font-family:"Playfair Display",Georgia,serif;letter-spacing:.2px}
.top small{color:#fff;opacity:.75;text-transform:uppercase;letter-spacing:2.5px;font-size:10.5px;font-weight:600}
main{max-width:760px;margin:0 auto;padding:14px 14px 96px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borda);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:9px 2px 8px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav button.on{color:var(--azul);font-weight:700;box-shadow:inset 0 3px 0 var(--ouro)}
.nav .ic{font-size:20px;line-height:1}
.card{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card.click{cursor:pointer}
.card.click:active{background:#f8fafc}
h2{font-size:17px;margin:18px 2px 10px}
h3{font-size:15px;margin:0 0 6px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.btn{border:0;background:var(--azul);color:#fff;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.sec{background:#e8eef6;color:var(--azul)}
.btn.ok{background:var(--ok)}
.btn.err{background:#fbe9e7;color:var(--err)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.wa{background:#25d366}
.btn:disabled{opacity:.5}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#eef1f5;color:var(--mut)}
.chip.confirmado,.chip.bom{background:#e3f4ea;color:var(--ok)}
.chip.pendente,.chip.manutencao{background:#fdf3e1;color:var(--warn)}
.chip.recusado,.chip.defeito{background:#fbe9e7;color:var(--err)}
.chip.admin{background:#e4edfb;color:var(--azul)}
.chip.lider{background:#efe8f6;color:#6b3fa0}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:500}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--borda);border-radius:10px;background:#fff;color:var(--txt)}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;background:#e6eaf0;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--mut);font-weight:600}
.seg button.on{background:var(--azul);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sheet-bg{position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px 28px}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;position:sticky;top:-16px;background:var(--bg);padding:6px 0;z-index:2}
.sheet-h h3{font-size:17px;margin:0}
.x{border:0;background:#e6eaf0;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--borda)}
.item:first-child{border-top:0}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--azul);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.anexo{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 8px;background:#f4f6f9;border-radius:8px;margin-top:5px}
.anexo a,.anexo .lk{color:var(--azul2);text-decoration:none;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ib{border:0;background:none;cursor:pointer;color:var(--mut);font-size:15px;padding:2px 5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#1c2430;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;max-width:90%}
.toast.err{background:var(--err)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.auth{max-width:380px;margin:8vh auto;padding:0 16px}
.auth .logo{font-size:42px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2>*{min-width:0}input,select,textarea{min-width:0}
.stat{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:10px 12px}
.stat b{font-size:20px;display:block}
.secao{font-weight:700;font-size:12px;letter-spacing:.8px;color:var(--mut);text-transform:uppercase;margin:14px 0 2px;padding-top:8px;border-top:1px solid var(--borda)}
.hora{flex:none;width:44px;font-weight:700;color:var(--azul);font-size:13px;margin-top:2px}
.hero{background:linear-gradient(140deg,#1c1c1e 0%,#1b2f6b 100%);color:#fff;border-radius:20px;padding:20px 18px 18px;margin:6px 0 14px;box-shadow:0 8px 24px rgba(27,47,107,.25)}
.hero .hi{font-family:"Playfair Display",Georgia,serif;font-size:25px;font-weight:700;margin:0}
.hero .dt{opacity:.7;font-size:13px;margin-top:3px}
.prox{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;margin-top:16px;cursor:pointer}
.dbox{flex:none;width:58px;height:62px;border-radius:12px;background:#fff;color:var(--azul);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1}
.dbox b{font-size:24px}.dbox span{font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.prox .lb{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#8fd0ff;font-weight:700}
.prox .tt{font-size:17px;font-weight:700;margin:2px 0}
.prox .sb{font-size:13px;opacity:.8}
.hbtns{display:flex;gap:8px;margin-top:12px}
.hbtns button{flex:1;border:0;border-radius:10px;padding:11px 8px;font-weight:600;cursor:pointer;background:#fff;color:var(--azul)}
.hbtns button.g{background:rgba(255,255,255,.14);color:#fff}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.quick button{border:1px solid var(--borda);background:#fff;border-radius:14px;padding:13px 4px 11px;font-size:12px;font-weight:600;color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.quick .ic{font-size:22px;line-height:1}
.auth{max-width:none;margin:0;padding:0;min-height:100vh;background:linear-gradient(160deg,#1c1c1e 0%,#1b2f6b 100%)}
.auth-in{max-width:400px;margin:0 auto;padding:7vh 18px 30px}
.auth-in>img{width:100%;border-radius:16px;display:block;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.auth h2{color:#fff;text-align:center;font-size:24px;margin:22px 0 4px}
.auth .sub{color:#c5cee0;text-align:center;margin:0 0 18px;font-size:14px}
.auth .seg{background:rgba(255,255,255,.12)}.auth .seg button{color:#cfd6e4}.auth .seg button.on{background:#fff;color:var(--azul)}
.auth .card{border:0;border-radius:16px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.auth a.mut{color:#c5cee0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{text-align:center;font-size:11px;color:var(--mut);font-weight:600;padding:4px 0}
.cd{background:#fff;border:1px solid var(--borda);border-radius:10px;min-height:56px;padding:5px;cursor:pointer;font-size:13px;text-align:left;color:var(--txt);min-width:0}
.cd.out{opacity:.35}.cd.hoje{border-color:var(--azul);font-weight:700}.cd.sel{background:#e8eef6;border-color:var(--azul)}
.cd i{display:block;font-style:normal;font-weight:500;font-size:10px;color:#fff;background:var(--azul2);border-radius:4px;padding:1px 3px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* ===== tema claro minimalista ===== */
:root{--azul:#17274a;--azul2:#b08a45;--ouro:#b08a45;--bg:#f6f4ef;--card:#eceae3;--txt:#26282b;--mut:#7b7a75;--borda:#dcd9d0;--r:18px}
.top{background:var(--bg);color:var(--txt);border-bottom:0;padding:18px 18px 2px;position:static}
.top h1{font-family:Inter,system-ui,sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:600;color:var(--mut)}
.top small{display:none}
h2,.sheet-h h3,.pmh h2{font-family:"Roboto Slab",Georgia,serif;font-weight:600;letter-spacing:0}
h2{font-size:18px;margin:26px 2px 10px}
.card,.stat{border:0;background:var(--card)}
.card.click:active{background:#e2dfd6}
input,select,textarea{background:#fff;border-color:transparent}
.btn{border-radius:12px}
.btn.sec{background:#dedbd2;color:var(--txt)}
.seg{background:#e6e3da}.seg button.on{background:var(--azul);color:#fff;box-shadow:none}
.nav{background:var(--bg)}
.nav button{gap:4px;padding:10px 2px 9px}
.nav button.on{box-shadow:none;color:var(--txt)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on svg{stroke-width:2.3}
.sheet,.sheet-h{background:var(--bg)}
.x{background:#e2dfd6}.anexo{background:#fff}.chip{background:#dedbd2}
.chip.admin{background:#efe6d3;color:#7a5e25}
.hora{color:var(--txt)}
.hello{font-family:"Roboto Slab",Georgia,serif;font-size:32px;line-height:1.15;margin:14px 2px 4px}
.hello span{font-weight:300;display:block;color:#5a5b5f}.hello b{font-weight:700}
.feat{background:var(--azul);color:#fff;border-radius:22px;padding:20px;margin:20px 0 10px;position:relative;cursor:pointer}
.feat .lb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#e0c184}
.feat .tt{font-family:"Roboto Slab",Georgia,serif;font-size:22px;font-weight:600;margin:6px 0 4px;padding-right:70px}
.feat .sb{font-size:13px;opacity:.75}
.feat .go{display:inline-flex;margin-top:18px;background:#fff;color:var(--txt);border-radius:999px;padding:8px 16px;font-weight:600;font-size:13px}
.feat .go.g{background:rgba(255,255,255,.14);color:#fff;margin-left:8px}
.feat .fd{position:absolute;top:16px;right:20px;text-align:center;line-height:1}
.feat .fd b{font-family:"Roboto Slab",Georgia,serif;font-size:36px;font-weight:300;display:block}
.feat .fd span{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;opacity:.7}
.auth{background:var(--bg);min-height:100vh}
.auth-in{max-width:380px;padding:9vh 28px 30px}
.auth .mark{width:132px;height:132px;margin:0 auto 26px;display:block;border-radius:30px}
.auth .hello{text-align:center;font-size:26px;margin-bottom:26px}
.auth .card{background:none;box-shadow:none;padding:0;border-radius:0}
.auth input{border:0;border-bottom:1.5px solid #cfcbc0;border-radius:0;background:none;padding:9px 0}
.auth input:focus{outline:0;border-bottom-color:var(--azul)}
.auth .btn{border-radius:999px;padding:14px;margin-top:26px!important}
.auth a.mut,.auth .alt{color:var(--mut);text-align:center;font-size:14px}
.auth .alt a{color:var(--txt);font-weight:600}
.cal{gap:7px}
.cd{border:0;background:#e4e1d8;border-radius:50%;aspect-ratio:1;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;font-weight:600;text-align:center}
.cd i{display:none}
.cd.ev{background:var(--azul);color:#fff}
.cd.hoje{outline:2px solid var(--azul2);outline-offset:2px}
.cd.sel{background:var(--azul2);color:#fff}
.cd.out{opacity:.3}
.mesh{display:flex;align-items:flex-end;justify-content:space-between;margin:10px 2px 14px}
.mesh b{font-size:22px;text-transform:uppercase;letter-spacing:.5px;display:block;line-height:1.1}
.mesh span{color:var(--mut);font-size:18px}
.pm{position:fixed;inset:0;background:#0f1620;color:#e8edf3;z-index:40;overflow:auto}
.pmh{position:sticky;top:0;background:#0f1620;border-bottom:1px solid #263243;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
.pmh h2{margin:0;font-size:20px;flex:1;min-width:200px}
.pmh .seg{margin:0;background:#1c2838}.pmh .seg button{color:#8fa3bb;padding:7px 12px}.pmh .seg button.on{background:#2d5a8e;color:#fff}
.pmclock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.pmb{max-width:1200px;margin:0 auto;padding:10px 18px 60px}
.pmsec{margin:18px 0 6px;font-size:13px;letter-spacing:1px;color:#8fa3bb;font-weight:700;text-transform:uppercase}
.pmi{display:grid;grid-template-columns:70px 1fr 40px;gap:14px;padding:14px;border:1px solid #263243;border-radius:12px;margin-bottom:8px;background:#162130}
.pmi.now{border-color:#3ecf6e;background:#16291f}
.pmi.done{opacity:.4}
.pmt{font-size:20px;font-weight:700;color:#8fc2ff}
.pmtit{font-size:18px;font-weight:700}
.pmsub{color:#b8c4d3;font-size:14px;white-space:pre-wrap;margin-top:2px}
.pmcues{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.pmcue{background:#0f1620;border-radius:8px;padding:8px 10px;font-size:14px;white-space:pre-wrap}
.pmcue b{display:block;font-size:11px;letter-spacing:.8px;color:#f5b942;margin-bottom:2px}
.pmfiles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.pmf{border:0;background:#2d5a8e;color:#fff;padding:9px 14px;border-radius:9px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.pmf.lk{background:#6b3fa0}
.pmok{width:36px;height:36px;border-radius:50%;border:2px solid #3a4a60;background:none;color:#3ecf6e;font-size:18px;cursor:pointer}
@media(max-width:700px){.pmi{grid-template-columns:50px 1fr 36px;gap:8px}.pmcues{grid-template-columns:1fr}}
.pm{background:var(--bg);color:var(--txt)}
.pmh{background:var(--bg);border-bottom:1px solid var(--borda)}
.pmclock{font-family:"Roboto Slab",Georgia,serif;font-weight:300;font-size:30px}
.pmsec{color:var(--mut)}
.pmi{background:var(--card);border:0;border-radius:18px}
.pmt{color:var(--txt);font-family:"Roboto Slab",Georgia,serif;font-weight:500}
.pmtit{font-family:"Roboto Slab",Georgia,serif;font-weight:600}

.pmcue{background:#fff}.pmcue b{color:var(--azul2)}
.pmf{background:var(--azul);border-radius:999px}

.pmf.fx{background:#dedbd2;color:var(--txt)}

.pmi.now{background:var(--azul);color:#fff}

.pmi.now .pmcue{background:rgba(255,255,255,.1)}.pmi.now .pmcue b{color:#e0c184}
.pmi.now .pmf{background:#fff;color:var(--azul)}.pmi.now .pmf.lk{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #fff}
.pmi.now .pmok{border-color:rgba(255,255,255,.5);color:#fff}
.pv{position:fixed;inset:0;background:#fff;z-index:40;overflow:auto}
.pvbar{position:sticky;top:0;background:#1c2430;padding:10px;display:flex;gap:8px;justify-content:center;z-index:2}
.pg{max-width:800px;margin:0 auto;padding:28px 26px;font-family:Arial,Helvetica,sans-serif;color:#1f2a5c;text-transform:uppercase;font-size:12.5px;letter-spacing:.3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pgh{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.pgh img{width:46%}

const fmtDia = ts => { const t = new Date(ts).toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" }); return t[0].toUpperCase() + t.slice(1); };
const toInput = ts => { if (!ts) return ""; const d = new Date(ts); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
const fromInput = v => v ? new Date(v).toISOString() : null;
const kb = n => n == null ? "" : n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.ceil(n / 1024) + " KB";
const brl = v => v == null ? "" : Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const normUrl = u => /^https?:\/\//i.test(u) ? u : "https://" + u;

/* ---------- componentes base ---------- */
function Sheet({ title, onClose, children }) {
  return html`<div class="sheet-bg" onClick=${e => e.target === e.currentTarget && onClose()}>
    <div class="sheet"><div class="sheet-h"><h3>${title}</h3><button class="x" onClick=${onClose}>×</button></div>${children}</div></div>`;
}
const Chip = ({ k, map }) => html`<span class=${"chip " + k}>${(map || {})[k] || k}</span>`;

function Toast({ msg }) { return msg ? html`<div class=${"toast " + (msg.err ? "err" : "")}>${msg.t}</div>` : null; }

/* ---------- autenticação ---------- */
function Auth() {
  const [modo, setModo] = useState("entrar");
  const [f, setF] = useState({ nome: "", email: "", senha: "" });
  const [msg, setMsg] = useState(""); const [busy, setBusy] = useState(false);
  const set = k => e => setF({ ...f, [k]: e.target.value });
  async function go(e) {
    e.preventDefault(); setBusy(true); setMsg("");
    try {
      if (modo === "entrar") {
        const { error } = await sb.auth.signInWithPassword({ email: f.email.trim(), password: f.senha });
        if (error) throw error;
      } else if (modo === "criar") {
        if (!f.nome.trim()) throw new Error("Informe seu nome");
        const { data, error } = await sb.auth.signUp({ email: f.email.trim(), password: f.senha, options: { data: { nome: f.nome.trim() }, emailRedirectTo: location.href.split("#")[0] } });
        if (error) throw error;
        if (!data.session) setMsg("Conta criada! Abra o e-mail de confirmação e depois entre aqui.");
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(f.email.trim(), { redirectTo: location.href.split("#")[0] });
        if (error) throw error;
        setMsg("Enviamos um link para redefinir a senha.");
      }
    } catch (err) { setMsg(traduz(err.message)); }
    setBusy(false);
  }
  return html`<div class="auth"><div class="auth-in">
    <img class="mark" src=${LOGO2} alt="Igreja Adventista do Sétimo Dia" />
    <div class="hello"><span>${modo === "criar" ? "Criar conta na" : modo === "recuperar" ? "Recuperar senha" : "Bem-vindo à"}</span><b>Central de Imperatriz</b></div>
    <form class="card" onSubmit=${go}>
      ${modo === "criar" && html`<label>Nome</label><input value=${f.nome} onInput=${set("nome")} autocomplete="name" />`}
      <label>E-mail</label><input type="email" required value=${f.email} onInput=${set("email")} autocomplete="email" />
      ${modo !== "recuperar" && html`<label>Senha</label><input type="password" required minlength="6" value=${f.senha} onInput=${set("senha")} autocomplete=${modo === "criar" ? "new-password" : "current-password"} />`}
      <button class="btn" style="width:100%" disabled=${busy}>${modo === "entrar" ? "Entrar" : modo === "criar" ? "Criar conta" : "Enviar link"}</button>
      ${msg && html`<p class="mut" style="margin:12px 0 0;text-align:center">${msg}</p>`}
    </form>
    ${modo === "entrar" && html`<p class="alt"><a href="#" class="mut" onClick=${e => { e.preventDefault(); setModo("recuperar"); }}>Esqueci a senha</a></p>`}
    <p class="alt">${modo === "entrar" ? "Não tem conta? " : "Já tem conta? "}<a href="#" onClick=${e => { e.preventDefault(); setModo(modo === "entrar" ? "criar" : "entrar"); }}>${modo === "entrar" ? "Criar conta" : "Entrar"}</a></p>
  </div></div>`;
}
function traduz(m) {
  if (/Invalid login/i.test(m)) return "E-mail ou senha incorretos.";
  if (/Email not confirmed/i.test(m)) return "Confirme seu e-mail antes de entrar.";
  if (/already registered/i.test(m)) return "Este e-mail já tem conta.";
  if (/Password should be/i.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
  return m;
}

function NovaSenha({ onDone }) {
  const [s, setS] = useState(""); const [msg, setMsg] = useState("");
  async function go(e) { e.preventDefault(); const { error } = await sb.auth.updateUser({ password: s }); if (error) setMsg(traduz(error.message)); else onDone(); }
  return html`<div class="auth"><div class="auth-in"><form class="card" onSubmit=${go}><h3>Nova senha</h3><input type="password" minlength="6" required value=${s} onInput=${e => setS(e.target.value)} /><button class="btn" style="width:100%;margin-top:12px">Salvar</button>${msg && html`<p class="mut">${msg}</p>`}</form></div></div>`;
}

/* ---------- app ---------- */
function App() {
  const [session, setSession] = useState(undefined);
  const [recovery, setRecovery] = useState(false);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data } = sb.auth.onAuthStateChange((ev, s) => { setSession(s); if (ev === "PASSWORD_RECOVERY") setRecovery(true); });
    return () => data.subscription.unsubscribe();
  }, []);
  if (session === undefined) return html`<div class="empty">Carregando…</div>`;
  if (recovery) return html`<${NovaSenha} onDone=${() => setRecovery(false)} />`;
  if (!session) return html`<${Auth} />`;
  return html`<${Main} uid=${session.user.id} />`;
}

function Main({ uid }) {
  const [d, setD] = useState(null);
  const [tab, setTab] = useState(() => (location.hash || "#inicio").slice(1));
  const [toast, setToast] = useState(null);
  const [eventoAberto, setEventoAberto] = useState(null);
  const [printEv, setPrintEv] = useState(null);
  const [painelEv, setPainelEv] = useState(null);

      sb.from("ministerios").select("*").order("nome"),
      sb.from("ministerio_membros").select("*"),
      sb.from("eventos").select("*").gte("inicio", desde).order("inicio"),

    const [profiles, ministerios, membros, eventos, escalas, patrimonio, itens, anexos, equipe, modelos, modeloItens, modeloFuncoes, config] = q.map(r => r.data);
    setD({ profiles, ministerios, membros, eventos, escalas, patrimonio, itens, anexos, equipe, modelos, modeloItens, modeloFuncoes, pdf: (config && config[0] && config[0].pdf) || {} });
  }, [notify]);
  useEffect(() => { load(); }, [load]);
  useEffect(() => { const h = () => setTab((location.hash || "#inicio").slice(1)); addEventListener("hashchange", h); return () => removeEventListener("hashchange", h); }, []);

  const ctx = useMemo(() => {
    if (!d) return null;

    const isAdmin = me.papel === "admin", isLider = isAdmin || me.papel === "lider";

    const nome = id => (d.profiles.find(p => p.id === id) || {}).nome || "—";
    const run = async (p, ok) => { const { error } = await p; if (error) { notify(error.message, true); return false; } if (ok) notify(ok); await load(); return true; };
    return { ...d, me, uid, isAdmin, isLider, lidera, nome, run, notify, load, abrirEvento: setEventoAberto, imprimir: setPrintEv, painel: setPainelEv };
  }, [d, uid, load, notify]);

  if (!ctx) return html`<div class="empty">Carregando…</div>`;
  const go = t => { location.hash = t; setTab(t); window.scrollTo(0, 0); };
  const tabs = [["inicio", "M4 11l8-7 8 7v9h-5v-6H9v6H4z", "Início"], ["agenda", "M5 6h14v14H5zM5 10h14M9 3v4M15 3v4", "Agenda"], ["patrimonio", "M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8", "Patrimônio"], ["pessoas", "M9 11a3 3 0 100-6 3 3 0 000 6zM3 20c0-3 3-5 6-5s6 2 6 5M17 11a2.5 2.5 0 100-5M17 15c2 0 4 1.5 4 4", "Equipes"], ["perfil", "M12 12a4 4 0 100-8 4 4 0 000 8zM5 20c0-3.5 3-6 7-6s7 2.5 7 6", "Perfil"]];
  const ev = eventoAberto && ctx.eventos.find(e => e.id === eventoAberto);
  const proxEv = ctx.eventos.find(e => new Date(e.inicio) >= Date.now() - 4 * 36e5) || ctx.eventos[ctx.eventos.length - 1];
  const pEv = painelEv ? ctx.eventos.find(e => e.id === painelEv) : (tab === "painel" ? proxEv : null);
  return html`<${Ctx.Provider} value=${ctx}>
    <div class="top"><h1>IASD · Central de Imperatriz</h1></div>

      ${tab === "patrimonio" && html`<${Patrimonio} />`}

    <nav class="nav">${tabs.map(([k, ic, l]) => html`<button key=${k} class=${tab === k ? "on" : ""} onClick=${() => go(k)}><svg viewBox="0 0 24 24"><path d=${ic} /></svg>${l}</button>`)}</nav>
    ${ev && html`<${EventoDetalhe} ev=${ev} onClose=${() => setEventoAberto(null)} />`}

/* ---------- início ---------- */
function Inicio({ go }) {
  const a = useApp();
  const agora = Date.now() - 3 * 36e5;
  const evById = Object.fromEntries(a.eventos.map(e => [e.id, e]));
  const futuro = id => evById[id] && new Date(evById[id].inicio) >= agora;
  const minhas = a.escalas.filter(s => s.profile_id === a.uid && futuro(s.evento_id)).sort((x, y) => new Date(evById[x.evento_id].inicio) - new Date(evById[y.evento_id].inicio));
  const partes = a.itens.filter(i => i.responsavel_id === a.uid && futuro(i.evento_id)).sort((x, y) => new Date(evById[x.evento_id].inicio) - new Date(evById[y.evento_id].inicio));
  const prox = a.eventos.filter(e => new Date(e.inicio) >= agora).slice(0, 4);
  const problemas = a.patrimonio.filter(p => p.estado === "defeito" || p.estado === "manutencao");
  const p0 = prox[0], d0 = p0 && new Date(p0.inicio);
  const diasAte = p0 && Math.round((new Date(d0.toDateString()) - new Date(new Date().toDateString())) / 864e5);
  const quando = diasAte <= 0 ? "Hoje" : diasAte === 1 ? "Amanhã" : `Em ${diasAte} dias`;
  return html`
    <div class="hello"><span>Olá,</span><b>${a.me.nome.split(" ")[0] || "bem-vindo"}</b></div>
    <div class="mut" style="margin-left:2px">${fmtDia(new Date())}</div>
    ${p0 ? html`<div class="feat" onClick=${() => a.abrirEvento(p0.id)}>
        <div class="fd"><b>${d0.getDate()}</b><span>${d0.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "")}</span></div>
        <div class="lb">Próximo · ${quando}</div><div class="tt">${p0.titulo}</div>
        <div class="sb">${d0.toLocaleDateString("pt-BR", { weekday: "long" })}, ${fmt(p0.inicio, { hour: "2-digit", minute: "2-digit" })}${p0.local ? " · " + p0.local : ""}</div>
        <span class="go">Ver programa →</span><span class="go g" onClick=${e => { e.stopPropagation(); a.painel(p0.id); }}>Painel da mídia</span>
      </div>` : html`<div class="card mut" style="margin-top:20px">Nenhum evento agendado.</div>`}

    ${partes.length > 0 && html`<h2>Minhas partes</h2>
      ${partes.map(i => html`<div class="card click" key=${i.id} onClick=${() => a.abrirEvento(i.evento_id)}>
        <div class="row between"><b>${i.titulo}</b><span class="mut">${fmt(evById[i.evento_id].inicio)}</span></div>
        <div class="mut">${evById[i.evento_id].titulo} · toque para enviar arquivo ou link</div></div>`)}`}

    ${minhas.length > 0 && html`<h2>Minhas escalas</h2>${minhas.map(s => html`<${EscalaCard} key=${s.id} s=${s} ev=${evById[s.evento_id]} />`)}`}

    ${prox.length > 1 && html`<h2>Depois</h2>${prox.slice(1).map(e => html`<${EventoCard} key=${e.id} e=${e} />`)}`}
  `;
}

function Mes() {

  const porDia = {}; a.eventos.forEach(e => { const k = new Date(e.inicio).toDateString(); (porDia[k] = porDia[k] || []).push(e); });
  const muda = n => setRef(new Date(ref.getFullYear(), ref.getMonth() + n, 1));

  const doDia = porDia[dia] || [];

          ${d.getDate()}${evs.slice(0, 2).map(e => html`<i key=${e.id}>${e.titulo}</i>`)}${evs.length > 2 && html`<i>+${evs.length - 2}</i>`}</button>`; })}

async function aplicarModelo(a, mid, evIds) {
  const m = a.modelos.find(x => x.id === mid), mi = a.modeloItens.filter(i => i.modelo_id === mid), mf = a.modeloFuncoes.filter(f => f.modelo_id === mid);
  const itens = [], funcs = [];
  evIds.forEach(id => {
    mi.forEach(i => itens.push({ evento_id: id, ordem: i.ordem, secao: i.secao, horario: i.horario, titulo: i.titulo, duracao_min: i.duracao_min, obs: i.obs, roteiro: i.roteiro }));
    if (!a.equipe.some(x => x.evento_id === id)) mf.forEach(f => funcs.push({ evento_id: id, funcao: f.funcao, ordem: f.ordem }));
  });
  if (itens.length) { const { error } = await sb.from("programa_itens").insert(itens); if (error) { a.notify(error.message, true); return false; } }
  if (funcs.length) await sb.from("equipe_dia").insert(funcs);
  if (m && m.chegada) await sb.from("eventos").update({ chegada: m.chegada }).in("id", evIds).is("chegada", null);
  return true;
}

function EventoForm({ ev, onClose }) {
  const a = useApp();
  const [f, setF] = useState(ev ? { ...ev, inicio: toInput(ev.inicio), fim: toInput(ev.fim) } : { titulo: "", tipo: "culto", inicio: "", fim: "", local: "", descricao: "", chegada: "" });
  const [repetir, setRepetir] = useState(0);
  const [modelo, setModelo] = useState("");
  const set = k => e => setF({ ...f, [k]: e.target.value });
  async function salvar(e) {
    e.preventDefault();
    const base = { titulo: f.titulo, tipo: f.tipo, inicio: fromInput(f.inicio), fim: fromInput(f.fim), local: f.local || null, descricao: f.descricao || null, chegada: f.chegada || null };
    let ok;
    if (ev) ok = await a.run(sb.from("eventos").update(base).eq("id", ev.id), "Evento atualizado");
    else {
      const rows = [base];
      for (let i = 1; i <= repetir; i++) {
        const add = d => d && new Date(new Date(d).getTime() + i * 7 * 864e5).toISOString();
        rows.push({ ...base, inicio: add(base.inicio), fim: add(base.fim) });
      }
      const { data, error } = await sb.from("eventos").insert(rows).select("id");
      if (error) { a.notify(error.message, true); return; }
      if (modelo && data) await aplicarModelo(a, modelo, data.map(x => x.id));
      a.notify(rows.length > 1 ? `${rows.length} eventos criados` : "Evento criado"); await a.load(); ok = true;
    }
    if (ok) onClose();
  }
  return html`<${Sheet} title=${ev ? "Editar evento" : "Novo evento"} onClose=${onClose}>
    <form class="card" onSubmit=${salvar}>
      <label>Título</label><input required value=${f.titulo} onInput=${set("titulo")} placeholder="Ex.: Culto de sábado" />
      <label>Tipo</label><select value=${f.tipo} onChange=${set("tipo")}>${Object.entries(TIPOS).map(([k, v]) => html`<option value=${k}>${v}</option>`)}</select>
      <div class="grid2"><div><label>Início</label><input type="datetime-local" required value=${f.inicio} onInput=${set("inicio")} /></div>
      <div><label>Fim (opcional)</label><input type="datetime-local" value=${f.fim} onInput=${set("fim")} /></div></div>
      <label>Local</label><input value=${f.local || ""} onInput=${set("local")} placeholder="Templo" />
      <label>Horário de chegada da equipe (aparece no programa)</label><input type="time" value=${f.chegada || ""} onInput=${set("chegada")} />
      <label>Descrição</label><textarea value=${f.descricao || ""} onInput=${set("descricao")} />
      ${!ev && a.modelos.length > 0 && html`<label>Modelo de programa</label><select value=${modelo} onChange=${e => setModelo(e.target.value)}>
        <option value="">Sem modelo (programa vazio)</option>${a.modelos.map(m => html`<option value=${m.id}>${m.nome}</option>`)}</select>`}
      ${!ev && html`<label>Repetir semanalmente</label><select value=${repetir} onChange=${e => setRepetir(+e.target.value)}>
        ${[0, 1, 3, 7, 11].map(n => html`<option value=${n}>${n === 0 ? "Não repetir" : `Mais ${n} semana(s)`}</option>`)}</select>`}
      <button class="btn" style="width:100%;margin-top:14px">Salvar</button>
    </form>
  </${Sheet}>`;
}

/* ---------- programa ---------- */
function textoPrograma(a, ev) {
  const itens = a.itens.filter(i => i.evento_id === ev.id);
  let t = `*${ev.titulo.toUpperCase()}*\n${fmtDia(ev.inicio)}${ev.local ? " — " + ev.local : ""}\n${ev.chegada ? `⚠️ Horário de chegada: ${ev.chegada}\n` : ""}`;
  let sec = null;
  itens.forEach(i => {
    if (i.secao && i.secao !== sec) { t += `\n*${i.secao}*\n`; sec = i.secao; } else if (sec === null) { t += "\n"; sec = ""; }
    const resp = i.responsavel_id ? a.nome(i.responsavel_id) : i.responsavel_nome;
    t += `${i.horario ? i.horario + " " : "• "}${i.titulo}${i.duracao_min ? ` (${i.duracao_min}')` : ""}${resp ? " — *" + resp + "*" : ""}\n`;
    (i.obs || "").split("\n").filter(Boolean).forEach(l => { t += `      ${l}\n`; });
    a.anexos.filter(x => x.item_id === i.id && x.tipo === "link").forEach(x => { t += `      🔗 ${x.titulo}: ${x.url}\n`; });
  });
  const gerais = a.anexos.filter(x => x.evento_id === ev.id && !x.item_id && x.tipo === "link");
  if (gerais.length) { t += `\n*Links*\n`; gerais.forEach(x => { t += `🔗 ${x.titulo}: ${x.url}\n`; }); }
  const eq = a.equipe.filter(x => x.evento_id === ev.id && x.nome);
  if (eq.length) { t += `\n*EQUIPE*\n`; eq.forEach(x => { t += `${x.funcao}: ${x.nome}\n`; }); }
  const esc = a.escalas.filter(s => s.evento_id === ev.id);
  if (esc.length) {
    t += `\n*ESCALA*\n`;
    a.ministerios.forEach(m => { const l = esc.filter(s => s.ministerio_id === m.id); if (l.length) t += `${m.nome}: ${l.map(s => a.nome(s.profile_id) + (s.funcao ? ` (${s.funcao})` : "")).join(", ")}\n`; });
  }
  return t.trim();
}

function Programa({ ev }) {
  const a = useApp();
  const itens = a.itens.filter(i => i.evento_id === ev.id);
  const gerais = a.anexos.filter(x => x.evento_id === ev.id && !x.item_id);
  const [editItem, setEditItem] = useState(null);
  const [anexarEm, setAnexarEm] = useState(undefined);
  const [copiar, setCopiar] = useState(false);
  const [salvarM, setSalvarM] = useState(false);
  const usarModelo = async id => { if (await aplicarModelo(a, id, [ev.id])) { a.notify("Modelo aplicado — ajuste a ordem, os hinos e os nomes"); a.load(); } };
  const total = itens.reduce((s, i) => s + (i.duracao_min || 0), 0);
  let secAtual = null;
  const ult = itens[itens.length - 1];

  async function padrao() {
    const rows = PROGRAMA_PADRAO.map((t, n) => ({ evento_id: ev.id, titulo: t, ordem: n + 1 }));
    await a.run(sb.from("programa_itens").insert(rows), "Programa padrão criado");
  }
  async function mover(i, dir) {
    const idx = itens.indexOf(i), j = itens[idx + dir]; if (!j) return;
    const oi = i.ordem, oj = j.ordem === oi ? oi + dir : j.ordem;
    await Promise.all([sb.from("programa_itens").update({ ordem: oj }).eq("id", i.id), sb.from("programa_itens").update({ ordem: oi }).eq("id", j.id)]);
    a.load();
  }
  async function compartilhar() {
    const t = textoPrograma(a, ev);
    try { await navigator.clipboard.writeText(t); a.notify("Programa copiado"); } catch { a.notify("Não foi possível copiar", true); }
  }
  const wa = "https://wa.me/?text=" + encodeURIComponent(textoPrograma(a, ev));

  return html`
    <div class="row wrap" style="margin-bottom:10px">
      <a class="btn wa sm" href=${wa} target="_blank" rel="noopener" style="text-decoration:none">Enviar no WhatsApp</a>
      <button class="btn sm" onClick=${() => a.painel(ev.id)}>🖥 Painel da mídia</button>
      <button class="btn sec sm" onClick=${() => a.imprimir(ev.id)}>📄 Gerar PDF</button>
      <button class="btn sec sm" onClick=${compartilhar}>Copiar texto</button>
      ${total > 0 && html`<span class="mut">⏱ ${total} min no total</span>`}
    </div>
    <div class="card">
      ${itens.length === 0 ? html`<div class="empty" style="padding:10px">
          ${a.isLider ? "Comece por um modelo:" : "Programa vazio."}
          ${a.isLider && html`<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
            ${a.modelos.map(m => html`<button class="btn" key=${m.id} onClick=${() => usarModelo(m.id)}>${m.nome} <span style="opacity:.6;font-weight:400">· ${a.modeloItens.filter(i => i.modelo_id === m.id).length} itens</span></button>`)}
            <button class="btn sec" onClick=${() => setCopiar(true)}>Copiar de outro evento</button>
            <button class="btn sec" onClick=${() => setEditItem({ evento_id: ev.id, titulo: "", ordem: 1 })}>Começar do zero</button></div>`}
        </div>` :
      itens.map((i, n) => {
        const resp = i.responsavel_id ? a.nome(i.responsavel_id) : i.responsavel_nome;
        const anx = a.anexos.filter(x => x.item_id === i.id);
        const podeEditar = a.isLider || i.responsavel_id === a.uid;
        const cab = i.secao && i.secao !== secAtual; if (i.secao) secAtual = i.secao;
        return html`<${React.Fragment} key=${i.id}>${cab && html`<div class="secao">${i.secao}</div>`}<div class="item">
          ${i.horario ? html`<div class="hora">${i.horario}</div>` : html`<div class="num">${n + 1}</div>`}
          <div style="flex:1;min-width:0">
            <div class="row between"><b>${i.titulo}</b>
              <div class="row" style="gap:0">
                ${a.isLider && html`<button class="ib" title="Subir" onClick=${() => mover(i, -1)}>↑</button><button class="ib" title="Descer" onClick=${() => mover(i, 1)}>↓</button>`}
                ${podeEditar && html`<button class="ib" title="Editar" onClick=${() => setEditItem(i)}>✏️</button>`}
              </div></div>
            <div class="mut">${resp ? "👤 " + resp : html`<i>sem responsável</i>`}${i.duracao_min ? ` · ${i.duracao_min} min` : ""}</div>
            ${i.obs && html`<div style="font-size:13px;margin-top:3px;white-space:pre-wrap">${i.obs}</div>`}
            ${i.roteiro && html`<div class="mut" style="margin-top:3px">📝 com texto de fala</div>`}
            ${i.midia && html`<div class="mut" style="margin-top:3px">🖥 com roteiro da mídia</div>`}
            ${anx.map(x => html`<${AnexoLinha} key=${x.id} x=${x} />`)}
            <button class="btn sec sm" style="margin-top:6px;padding:4px 9px" onClick=${() => setAnexarEm(i.id)}>+ arquivo / link</button>
          </div></div></${React.Fragment}>`;
      })}
      ${a.isLider && itens.length > 0 && html`<div class="row" style="margin-top:10px;border-top:1px solid var(--borda);padding-top:10px">
        <button class="btn sm" onClick=${() => setEditItem({ evento_id: ev.id, titulo: "", ordem: (ult?.ordem || 0) + 1, secao: ult?.secao || "", horario: somaMin(ult?.horario, ult?.duracao_min) })}>+ Item</button>
        <button class="btn sec sm" onClick=${() => setSalvarM(true)}>Salvar como modelo</button></div>`}
    </div>

    <h2 style="margin-top:14px">Arquivos e links gerais</h2>
    <div class="card">
      ${gerais.length === 0 && html`<div class="mut">Nada enviado ainda.</div>`}
      ${gerais.map(x => html`<${AnexoLinha} key=${x.id} x=${x} />`)}
      <button class="btn sec sm" style="margin-top:8px" onClick=${() => setAnexarEm(null)}>+ Enviar arquivo ou link</button>
    </div>
    ${editItem && html`<${ItemForm} item=${editItem} onClose=${() => setEditItem(null)} />`}
    ${anexarEm !== undefined && html`<${AnexoForm} ev=${ev} itemId=${anexarEm} onClose=${() => setAnexarEm(undefined)} />`}
    ${copiar && html`<${CopiarPrograma} ev=${ev} onClose=${() => setCopiar(false)} />`}
    ${salvarM && html`<${SalvarModelo} ev=${ev} onClose=${() => setSalvarM(false)} />`}
  `;
}

function SalvarModelo({ ev, onClose }) {
  const a = useApp();
  const [nome, setNome] = useState(ev.titulo);
  async function salvar(e) {
    e.preventDefault();
    const { data, error } = await sb.from("modelos").insert({ nome: nome.trim(), chegada: ev.chegada || null }).select("id").single();
    if (error) return a.notify(error.message, true);
    const itens = a.itens.filter(i => i.evento_id === ev.id).map(i => ({ modelo_id: data.id, ordem: i.ordem, secao: i.secao, horario: i.horario, titulo: i.titulo, duracao_min: i.duracao_min, obs: i.obs, roteiro: i.roteiro }));
    const funcs = a.equipe.filter(x => x.evento_id === ev.id).map(x => ({ modelo_id: data.id, funcao: x.funcao, ordem: x.ordem }));
    if (itens.length) await sb.from("modelo_itens").insert(itens);
    if (funcs.length) await sb.from("modelo_funcoes").insert(funcs);
    a.notify("Modelo salvo"); await a.load(); onClose();
  }
  return html`<${Sheet} title="Salvar como modelo" onClose=${onClose}>
    <form class="card" onSubmit=${salvar}>
      <div class="mut">Guarda a ordem, os horários, os blocos e as funções deste programa para reutilizar. Os nomes dos responsáveis não são guardados.</div>
      <label>Nome do modelo</label><input required value=${nome} onInput=${e => setNome(e.target.value)} placeholder="Ex.: Santa Ceia" />
      <button class="btn" style="width:100%;margin-top:14px">Salvar modelo</button>
    </form>
    ${a.modelos.length > 0 && html`<h2>Modelos existentes</h2><div class="card">${a.modelos.map(m => html`<div class="row between" key=${m.id} style="padding:5px 0">
      <span>${m.nome} <span class="mut">· ${a.modeloItens.filter(i => i.modelo_id === m.id).length} itens</span></span>
      <button class="ib" title="Excluir modelo" onClick=${() => confirm(`Excluir o modelo "${m.nome}"?`) && a.run(sb.from("modelos").delete().eq("id", m.id), "Modelo excluído")}>🗑</button></div>`)}</div>`}
  </${Sheet}>`;
}

function CopiarPrograma({ ev, onClose }) {
  const a = useApp();
  const fontes = a.eventos.filter(e => e.id !== ev.id && a.itens.some(i => i.evento_id === e.id)).reverse();
  async function copiar(src) {
    const rows = a.itens.filter(i => i.evento_id === src.id).map(i => ({ evento_id: ev.id, titulo: i.titulo, ordem: i.ordem, duracao_min: i.duracao_min, secao: i.secao, horario: i.horario, obs: i.obs, roteiro: i.roteiro, responsavel_id: null, responsavel_nome: null }));
    const funcs = a.equipe.some(x => x.evento_id === ev.id) ? [] : a.equipe.filter(x => x.evento_id === src.id).map(x => ({ evento_id: ev.id, funcao: x.funcao, ordem: x.ordem, nome: null }));
    if (funcs.length) await sb.from("equipe_dia").insert(funcs);
    if (!ev.chegada && src.chegada) await sb.from("eventos").update({ chegada: src.chegada }).eq("id", ev.id);
    if (await a.run(sb.from("programa_itens").insert(rows), "Programa copiado — troque hinos e nomes")) onClose();
  }
  return html`<${Sheet} title="Copiar programa de…" onClose=${onClose}>
    ${fontes.length === 0 ? html`<div class="empty">Nenhum evento com programa ainda.</div>` :
      fontes.map(e => html`<div class="card click" key=${e.id} onClick=${() => copiar(e)}><b>${e.titulo}</b><div class="mut">${fmt(e.inicio)} · ${a.itens.filter(i => i.evento_id === e.id).length} itens</div></div>`)}
  </${Sheet}>`;
}

    e.preventDefault();
    const meus = { duracao_min: f.duracao_min ? +f.duracao_min : null, obs: f.obs || null, roteiro: f.roteiro || null };
    const dados = so ? meus : { ...meus, midia: f.midia || null, titulo: f.titulo, secao: f.secao.trim() || null, horario: f.horario || null,
      responsavel_id: externo ? null : (f.responsavel_id || null), responsavel_nome: externo ? (f.responsavel_nome.trim() || null) : null };
    const p = novo ? sb.from("programa_itens").insert({ ...dados, evento_id: item.evento_id, ordem: item.ordem }) : sb.from("programa_itens").update(dados).eq("id", item.id);
    if (await a.run(p, "Programa salvo")) onClose();

  async function excluir() { if (confirm("Remover este item do programa?") && await a.run(sb.from("programa_itens").delete().eq("id", item.id), "Item removido")) onClose(); }
  return html`<${Sheet} title=${novo ? "Novo item" : "Editar item"} onClose=${onClose}>
    <form class="card" onSubmit=${salvar}>
      <div class="grid2" style="grid-template-columns:110px 1fr"><div><label>Horário</label><input type="time" disabled=${so} value=${f.horario} onInput=${set("horario")} /></div>

      <datalist id="sugestoes">${PROGRAMA_PADRAO.concat(["Oferta", "Dízimos e ofertas", "Avisos", "Momento das crianças", "Santa Ceia", "Batismo"]).map(s => html`<option value=${s} />`)}</datalist>
      ${!so && html`<label>Responsável</label>
        <div class="seg" style="margin-bottom:6px"><button type="button" class=${externo ? "on" : ""} onClick=${() => setExterno(true)}>Digitar nome</button><button type="button" class=${!externo ? "on" : ""} onClick=${() => setExterno(false)}>Membro do app</button></div>
        ${externo ? html`<input value=${f.responsavel_nome} onInput=${set("responsavel_nome")} placeholder="Ex.: Pr. Marcos, Novo Canto, Equipe" />` :
          html`<select value=${f.responsavel_id} onChange=${set("responsavel_id")}><option value="">— ninguém ainda —</option>${a.profiles.map(p => html`<option value=${p.id}>${p.nome}</option>`)}</select>`}`}
      <div class="grid2" style="grid-template-columns:110px 1fr"><div><label>Duração (min)</label><input type="number" min="0" value=${f.duracao_min} onInput=${set("duracao_min")} /></div>
      ${!so && html`<div><label>Bloco (opcional)</label><input value=${f.secao} onInput=${set("secao")} placeholder="Ex.: 10:00 CULTO DIVINO" list="secoes" /><datalist id="secoes">${secoes.map(s => html`<option value=${s} />`)}</datalist></div>`}</div>
      <label>Linhas abaixo (uma por linha: hinos, vídeos, avisos)</label><textarea value=${f.obs} onInput=${set("obs")} placeholder=${"HINO – A DEUS DEMOS GLÓRIA (H.A. 19)\nHINO – MEU PASTOR"} />
      ${!so && html`<label>🖥 Roteiro da mídia (o que vai no telão)</label><textarea value=${f.midia} onInput=${set("midia")} placeholder=${"Ex.: Letra do hino 19 · depois slide do tema"} />`}
      ${maisTexto ? html`<label>Texto de fala (sai no PDF abaixo do item)</label><textarea style="min-height:140px" value=${f.roteiro} onInput=${set("roteiro")} />` :
        html`<button type="button" class="btn sec sm" style="margin-top:10px" onClick=${() => setMaisTexto(true)}>+ Texto de fala (ex.: boas-vindas)</button>`}
      <button class="btn" style="width:100%;margin-top:14px">Salvar</button>
      ${!novo && a.isLider && html`<button type="button" class="btn err" style="width:100%;margin-top:8px" onClick=${excluir}>Remover item</button>`}

function AnexoLinha({ x }) {
  const a = useApp();
  async function abrir() {
    if (x.tipo === "link") return;
    const { data, error } = await sb.storage.from("anexos").createSignedUrl(x.storage_path, 3600);
    if (error) return a.notify(error.message, true);
    window.open(data.signedUrl, "_blank");
  }
  async function remover() {
    if (!confirm(`Remover "${x.titulo}"?`)) return;
    if (x.storage_path) await sb.storage.from("anexos").remove([x.storage_path]);
    a.run(sb.from("anexos").delete().eq("id", x.id), "Removido");
  }
  const pode = x.enviado_por === a.uid || a.isLider;
  return html`<div class="anexo">
    <span>${x.tipo === "link" ? "🔗" : "📎"}</span>
    ${x.tipo === "link" ? html`<a href=${x.url} target="_blank" rel="noopener">${x.titulo}</a>` : html`<span class="lk" onClick=${abrir}>${x.titulo}</span>`}
    <span class="mut" style="font-size:11px">${x.tipo === "arquivo" ? kb(x.tamanho) + " · " : ""}${a.nome(x.enviado_por).split(" ")[0]}</span>
    ${pode && html`<button class="ib" onClick=${remover}>🗑</button>`}
  </div>`;
}

function AnexoForm({ ev, itemId, onClose }) {
  const a = useApp();
  const [tipo, setTipo] = useState("link");
  const [titulo, setTitulo] = useState(""); const [url, setUrl] = useState("");
  const [files, setFiles] = useState([]); const [busy, setBusy] = useState(false);
  const item = itemId && a.itens.find(i => i.id === itemId);
  async function enviar(e) {
    e.preventDefault(); setBusy(true);
    try {
      if (tipo === "link") {
        const u = normUrl(url.trim());
        const { error } = await sb.from("anexos").insert({ evento_id: ev.id, item_id: itemId, tipo: "link", titulo: titulo.trim() || u.replace(/^https?:\/\//, "").slice(0, 60), url: u });
        if (error) throw error;
      } else {
        for (const file of files) {
          const limpo = file.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w.\-]+/g, "_");
          const path = `${ev.id}/${crypto.randomUUID()}-${limpo}`;
          const up = await sb.storage.from("anexos").upload(path, file, { contentType: file.type || undefined });
          if (up.error) throw up.error;
          const { error } = await sb.from("anexos").insert({ evento_id: ev.id, item_id: itemId, tipo: "arquivo", titulo: files.length === 1 && titulo.trim() ? titulo.trim() : file.name, storage_path: path, tamanho: file.size });
          if (error) throw error;
        }
      }
      a.notify("Enviado!"); await a.load(); onClose();
    } catch (err) { a.notify(err.message, true); }
    setBusy(false);
  }
  return html`<${Sheet} title=${item ? "Anexar em: " + item.titulo : "Arquivo ou link do evento"} onClose=${onClose}>
    <div class="seg"><button class=${tipo === "link" ? "on" : ""} onClick=${() => setTipo("link")}>🔗 Link</button><button class=${tipo === "arquivo" ? "on" : ""} onClick=${() => setTipo("arquivo")}>📎 Arquivo</button></div>
    <form class="card" onSubmit=${enviar}>
      ${tipo === "link" ? html`<label>Link (YouTube, Drive, Spotify…)</label><input required value=${url} onInput=${e => setUrl(e.target.value)} placeholder="https://" inputmode="url" />` :
        html`<label>Arquivos (até 50 MB cada — slides, PDF, áudio, vídeo, imagem)</label><input type="file" multiple required onChange=${e => setFiles([...e.target.files])} />
        ${files.length > 0 && html`<div class="mut" style="margin-top:4px">${files.length} arquivo(s) · ${kb(files.reduce((s, f) => s + f.size, 0))}</div>`}`}
      ${(tipo === "link" || files.length <= 1) && html`<label>Nome (opcional)</label><input value=${titulo} onInput=${e => setTitulo(e.target.value)} placeholder=${tipo === "link" ? "Ex.: Playback do louvor" : "Ex.: Slides do sermão"} />`}
      <button class="btn" style="width:100%;margin-top:14px" disabled=${busy || (tipo === "arquivo" && files.length === 0)}>${busy ? "Enviando…" : "Enviar"}</button>
    </form>
  </${Sheet}>`;
}

/* ---------- escala ---------- */
function Escala({ ev }) {
  const a = useApp();
  const esc = a.escalas.filter(s => s.evento_id === ev.id);
  const meus = a.ministerios.filter(m => a.lidera(m.id));
  const [f, setF] = useState({ ministerio_id: meus[0]?.id || "", profile_id: "", funcao: "" });
  const membrosDo = mid => a.membros.filter(x => x.ministerio_id === mid).map(x => x.profile_id);
  const doMin = membrosDo(f.ministerio_id);
  const opcoes = [...a.profiles].sort((x, y) => (doMin.includes(y.id) - doMin.includes(x.id)) || x.nome.localeCompare(y.nome));
  async function add(e) {
    e.preventDefault();
    if (await a.run(sb.from("escalas").insert({ evento_id: ev.id, ministerio_id: f.ministerio_id, profile_id: f.profile_id, funcao: f.funcao || null }), "Pessoa escalada"))
      setF({ ...f, profile_id: "", funcao: "" });
  }
  const setStatus = (s, st) => a.run(sb.from("escalas").update({ status: st }).eq("id", s.id));
  return html`
    <${EquipeDia} ev=${ev} />
    <h2 style="margin-top:14px">Confirmação pelo app</h2>
    ${a.ministerios.map(m => {
      const l = esc.filter(s => s.ministerio_id === m.id); if (!l.length) return null;
      return html`<div class="card" key=${m.id}><h3>${m.nome}</h3>
        ${l.map(s => html`<div class="row between" key=${s.id} style="padding:6px 0;border-top:1px solid var(--borda)">
          <div><b>${a.nome(s.profile_id)}</b>${s.funcao && html`<span class="mut"> · ${s.funcao}</span>`}</div>
          <div class="row" style="gap:4px">
            ${s.profile_id === a.uid && s.status !== "confirmado" && html`<button class="btn ok sm" onClick=${() => setStatus(s, "confirmado")}>✓</button>`}
            ${s.profile_id === a.uid && s.status !== "recusado" && html`<button class="btn err sm" onClick=${() => setStatus(s, "recusado")}>✕</button>`}
            <${Chip} k=${s.status} map=${STATUS} />
            ${a.lidera(s.ministerio_id) && html`<button class="ib" onClick=${() => confirm("Tirar da escala?") && a.run(sb.from("escalas").delete().eq("id", s.id))}>🗑</button>`}
          </div></div>`)}
      </div>`;
    })}
    ${esc.length === 0 && html`<div class="card mut">Para quem tem conta no app: a pessoa recebe a escala e confirma pelo celular.</div>`}
    ${meus.length > 0 && html`<form class="card" onSubmit=${add}><h3>Escalar pessoa</h3>
      <label>Equipe</label><select value=${f.ministerio_id} onChange=${e => setF({ ...f, ministerio_id: e.target.value })}>${meus.map(m => html`<option value=${m.id}>${m.nome}</option>`)}</select>
      <label>Pessoa</label><select required value=${f.profile_id} onChange=${e => setF({ ...f, profile_id: e.target.value })}><option value="">Escolha…</option>
        ${opcoes.map(p => html`<option value=${p.id}>${doMin.includes(p.id) ? "★ " : ""}${p.nome}</option>`)}</select>
      <label>Função (opcional)</label><input value=${f.funcao} onInput=${e => setF({ ...f, funcao: e.target.value })} placeholder="Ex.: Mesa de som, Câmera 1, Teclado" />
      <button class="btn" style="width:100%;margin-top:12px">Escalar</button></form>`}
  `;
}

/* ---------- equipe do dia + PDF ---------- */
function EquipeDia({ ev }) {
  const a = useApp();
  const l = a.equipe.filter(x => x.evento_id === ev.id);
  const [f, setF] = useState({ funcao: "", nome: "" });
  const prox = (l[l.length - 1]?.ordem || 0) + 1;
  const salvarNome = (x, nome) => nome.trim() !== (x.nome || "") && a.run(sb.from("equipe_dia").update({ nome: nome.trim() || null }).eq("id", x.id));
  const padrao = () => a.run(sb.from("equipe_dia").insert(FUNCOES_PADRAO.map((fn, n) => ({ evento_id: ev.id, funcao: fn, ordem: n + 1 }))), "Funções adicionadas");
  async function add(e) { e.preventDefault(); if (!f.funcao.trim()) return; if (await a.run(sb.from("equipe_dia").insert({ evento_id: ev.id, funcao: f.funcao.trim().toUpperCase(), nome: f.nome.trim() || null, ordem: prox }))) setF({ funcao: "", nome: "" }); }
  return html`<div class="card"><h3>Equipe do dia</h3>
    <div class="mut" style="margin-bottom:6px">Sai nos quadros do PDF. Os nomes são livres (pessoa, grupo ou "Equipe").</div>
    ${l.length === 0 && html`<div class="mut">Nenhuma função ainda.${a.isLider && html` <button class="btn sm" style="margin-left:6px" onClick=${padrao}>Usar funções padrão</button>`}</div>`}

function PainelMidia({ ev, onClose }) {
  const a = useApp();

  const [feitos, setFeitos] = useState({});
  useEffect(() => { const t1 = setInterval(() => setAgora(new Date()), 15000); const t2 = setInterval(() => a.load(), 60000); return () => { clearInterval(t1); clearInterval(t2); }; }, [a.load]);
  const itens = a.itens.filter(i => i.evento_id === ev.id);
  const gerais = a.anexos.filter(x => x.evento_id === ev.id && !x.item_id);
  const hoje = new Date(ev.inicio).toDateString() === agora.toDateString();
  const hm = agora.toTimeString().slice(0, 5);
  let atual = null; if (hoje) itens.forEach(i => { if (i.horario && i.horario <= hm) atual = i.id; });
  async function baixar(x) {
    const { data, error } = await sb.storage.from("anexos").createSignedUrl(x.storage_path, 3600, { download: x.titulo });
    if (error) return a.notify(error.message, true);
    if (!window.open(data.signedUrl, "_blank")) location.href = data.signedUrl;
  }
  const arquivos = l => l.length > 0 && html`<div class="pmfiles">${l.map(x => x.tipo === "link" ?
    html`<a key=${x.id} class="pmf lk" href=${x.url} target="_blank" rel="noopener">🔗 ${x.titulo}</a>` :
    html`<button key=${x.id} class="pmf" onClick=${() => baixar(x)}>⬇ ${x.titulo} ${x.tamanho ? "· " + kb(x.tamanho) : ""}</button>`)}</div>`;
  let sec = null;
  return html`<div class="pm">
    <div class="pmh">
      <h2>${ev.titulo} <span style="font-weight:400;color:#7b7a75;font-size:15px;font-family:Inter,sans-serif">· ${fmtDia(ev.inicio)}</span></h2>
      <div class="pmclock">${hm}</div>
      <button class="pmf fx" onClick=${onClose}>Fechar</button>
    </div>
    <div class="pmb">
      ${gerais.length > 0 && html`<div class="pmsec">Arquivos e links gerais</div>${arquivos(gerais)}`}
      ${itens.length === 0 && html`<div class="empty">O programa deste evento ainda está vazio.</div>`}
      ${itens.map(i => {
        const cab = i.secao && i.secao !== sec; if (i.secao) sec = i.secao;
        const resp = i.responsavel_id ? a.nome(i.responsavel_id) : i.responsavel_nome;
        const ok = feitos[i.id];
        return html`<${React.Fragment} key=${i.id}>${cab && html`<div class="pmsec">${i.secao}</div>`}
          <div class=${"pmi" + (i.id === atual && !ok ? " now" : "") + (ok ? " done" : "")}>
            <div class="pmt">${i.horario || "—"}</div>
            <div>
              <div class="pmtit">${i.titulo}${resp && html`<span class="pmr"> · ${resp}</span>`}${i.duracao_min ? html`<span class="pmd"> (${i.duracao_min} min)</span>` : ""}</div>
              ${i.obs && html`<div class="pmsub">${i.obs}</div>`}
              ${i.midia && html`<div class="pmcue" style="margin-top:8px"><b>🖥 MÍDIA / TELÃO</b>${i.midia}</div>`}
              ${arquivos(a.anexos.filter(x => x.item_id === i.id))}
            </div>
            <button class="pmok" title="Marcar como feito" onClick=${() => setFeitos({ ...feitos, [i.id]: !ok })}>${ok ? "✓" : ""}</button>
          </div></${React.Fragment}>`;
      })}
    </div></div>`;
}

function AparenciaForm({ onClose }) {
  const a = useApp();
  const [c, setC] = useState({ estilo: "classico", ...a.pdf });
  const [busy, setBusy] = useState(false);
  const E = ESTILOS[c.estilo] || ESTILOS.classico;
  async function muda(patch) {
    const n = { ...c, ...patch }; setC(n);
    const { error } = await sb.from("config").upsert({ id: 1, pdf: n, updated_at: new Date().toISOString() });
    if (error) return a.notify(error.message, true);
    await a.load();
  }
  async function enviarLogo(e, campo = "logo") {
    const f = e.target.files[0]; if (!f) return; setBusy(true);
    const path = `${campo}-${Date.now()}.${(f.name.split(".").pop() || "png").toLowerCase()}`;
    const up = await sb.storage.from("publico").upload(path, f, { contentType: f.type });
    if (up.error) a.notify(up.error.message, true);
    else { await muda({ [campo]: sb.storage.from("publico").getPublicUrl(path).data.publicUrl }); a.notify("Imagem trocada"); }
    setBusy(false);
  }
  const cor = (k, rotulo, padrao) => html`<div class="cor"><span>${rotulo}</span><input type="color" value=${c[k] || padrao} onChange=${e => muda({ [k]: e.target.value })} /></div>`;
  const chk = (k, rotulo) => html`<label class="chk"><input type="checkbox" checked=${c[k] !== false} onChange=${e => muda({ [k]: e.target.checked })} />${rotulo}</label>`;
  return html`<${Sheet} title="Aparência do PDF" onClose=${onClose}>

    <h2 style="margin-top:8px">Estilo</h2>

      <div class="row between"><b>${e.nome}</b><span class="row" style="gap:4px">${[e.t, e.d, e.l].map((x, n) => html`<span key=${n} style=${{ width: 16, height: 16, borderRadius: 8, background: x, display: "inline-block" }}></span>`)}</span></div>
      <div class="mut">${e.desc}</div></div>`)}
    <h2>Cores</h2>
    <div class="card">${cor("corTitulo", "Título e cabeçalho", E.t)}${cor("corDestaque", "Destaques (hinos, nomes, quadros)", E.d)}${cor("corLinha", "Linhas", E.l)}
      <button class="btn sec sm" style="margin-top:6px" onClick=${() => muda({ corTitulo: null, corDestaque: null, corLinha: null })}>Voltar às cores do estilo</button></div>
    <h2>Imagem do topo</h2>
    <div class="card"><div class="mut" style="margin-bottom:6px">Logo ou banner da igreja (PNG ou JPG, até 5 MB).</div>
      <input type="file" accept="image/png,image/jpeg,image/webp" disabled=${busy} onChange=${enviarLogo} />
      ${c.logo && html`<button class="btn sec sm" style="margin-top:8px" onClick=${() => muda({ logo: null })}>Usar a imagem padrão</button>`}</div>
    <h2>Marca d'água</h2>
    <div class="card"><label class="chk"><input type="checkbox" checked=${c.marca ?? !!E.marca} onChange=${e => muda({ marca: e.target.checked })} />Mostrar marca d'água no fundo</label>
      <div class="mut" style="margin:4px 0 6px">Imagem própria (de preferência PNG com fundo transparente). Sem ela, usa a logo da igreja.</div>
      <input type="file" accept="image/png,image/jpeg,image/webp" disabled=${busy} onChange=${e => enviarLogo(e, "marcaImg")} />
      ${c.marcaImg && html`<button class="btn sec sm" style="margin-top:8px" onClick=${() => muda({ marcaImg: null })}>Usar a logo da igreja</button>`}</div>
    <h2>O que aparece</h2>
    <div class="card">${chk("mostrarChegada", "Horário de chegada")}${chk("mostrarFala", "Texto de fala (boas-vindas)")}${chk("mostrarEquipe", "Quadros da equipe do dia")}</div>
  </${Sheet}>`;
}

function PrintView({ ev, onClose }) {
  const a = useApp();
  const itens = a.itens.filter(i => i.evento_id === ev.id);
  const eq = a.equipe.filter(x => x.evento_id === ev.id);
  const d = new Date(ev.inicio);
  const dataTxt = d.toLocaleDateString("pt-BR", { weekday: "long" }).replace("-feira", "") + " " + d.toLocaleDateString("pt-BR").replace(/\//g, ".");
  const meio = Math.ceil(eq.length / 2);
  let sec = null;
  const [apar, setApar] = useState(false);
  const c = a.pdf, est = ESTILOS[c.estilo] ? c.estilo : "classico", E = ESTILOS[est];
  const vars = { "--pt": c.corTitulo || E.t, "--pd": c.corDestaque || E.d, "--pl": c.corLinha || E.l };
  const temMarca = c.marca ?? !!E.marca;
  useEffect(() => {
    // Antes de imprimir: escolhe o zoom que faz o programa ocupar a folha A4 inteira (uma página só).
    const ALVO = 266 * 96 / 25.4 * 0.97; // altura útil: 297mm − 31mm de margem, com folga de 3%
    const antes = () => {
      const el = document.querySelector(".pv .pg"); if (!el) return;
      const ini = document.createElement("div"), fim = document.createElement("div");
      el.before(ini); el.after(fim);
      el.classList.add("pmeasure");
      const alt = z => { el.style.zoom = z; el.style.width = (182 / z) + "mm"; return fim.getBoundingClientRect().top - ini.getBoundingClientRect().bottom; };
      let lo = 0.55, hi = 1.6;
      if (alt(hi) <= ALVO) lo = hi;
      else for (let k = 0; k < 14; k++) { const m = (lo + hi) / 2; if (alt(m) <= ALVO) lo = m; else hi = m; }
      ini.remove(); fim.remove(); el.style.width = "";
      el.classList.remove("pmeasure"); el.style.zoom = lo.toFixed(3);
    };
    const depois = () => { const el = document.querySelector(".pv .pg"); if (el) el.style.zoom = ""; };
    addEventListener("beforeprint", antes); addEventListener("afterprint", depois);
    return () => { removeEventListener("beforeprint", antes); removeEventListener("afterprint", depois); depois(); };
  }, []);
  const box = l => l.length > 0 && html`<div class="pb">${l.map(x => html`<div key=${x.id}>${x.funcao}: <span>${x.nome || "________"}</span></div>`)}</div>`;
  return html`<div class="pv">
    <div class="pvbar"><button class="btn" onClick=${() => window.print()}>🖨 Imprimir / Salvar em PDF</button>${a.isAdmin && html`<button class="btn sec" onClick=${() => setApar(true)}>🎨 Aparência</button>`}<button class="btn sec" onClick=${onClose}>Fechar</button></div>
    <div class=${"pg est-" + est} style=${vars}>
      ${temMarca && html`<img class=${"wm" + (c.marcaImg ? "" : " pad")} src=${c.marcaImg || LOGO2} alt="" />`}
      <div class="pgh"><div><div class="pt">${ev.titulo}</div><div class="pd">${dataTxt}</div>
        <div class="pdn"><b>${d.getDate()}</b><div><span>${d.toLocaleDateString("pt-BR", { month: "long" })}</span><span>${d.getFullYear()}</span></div><em>${d.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "")}</em></div>
        ${ev.chegada && c.mostrarChegada !== false && html`<div class="pc">Recomendação importante:<br /><i>Horário de chegada – ${ev.chegada}H</i></div>`}</div>
        <img src=${c.logo || LOGO} alt="" /></div>
      <div class="pcols">${itens.map(i => {
        const cab = i.secao && i.secao !== sec; if (i.secao) sec = i.secao;
        const resp = i.responsavel_id ? a.nome(i.responsavel_id) : i.responsavel_nome;
        return html`<${React.Fragment} key=${i.id}>${cab && html`<div class="ps">${i.secao}</div>`}
          <div class="prow"><div class="phh">${i.horario ? i.horario + "H" : ""}</div><div class="prc">
            <div class="pl1"><span class="ptit">${marca(i.titulo)}</span>${i.duracao_min ? html`<span class="pdur"> (${i.duracao_min}’)</span>` : ""}${resp && html`<span class="pdash"> – </span><span class="pn">${resp}</span>`}</div>
            ${(i.obs || "").split("\n").filter(Boolean).map((l, k) => html`<div key=${k}>${marca(l)}</div>`)}
            ${i.roteiro && c.mostrarFala !== false && html`<div class="prot">${i.roteiro.split("\n").filter(Boolean).map((l, k) => html`<p key=${k}>${l}</p>`)}</div>`}
          </div></div></${React.Fragment}>`;
      })}</div>
      ${eq.length > 0 && c.mostrarEquipe !== false && html`<div class="pbx">${box(eq.slice(0, meio))}${box(eq.slice(meio))}</div>`}
    </div>
    ${apar && html`<${AparenciaForm} onClose=${() => setApar(false)} />`}</div>`;
}

    e.preventDefault();
    const d = { nome: f.nome, categoria: f.categoria, marca: f.marca || null, modelo: f.modelo || null, numero_serie: f.numero_serie || null, local: f.local || null, estado: f.estado,

    const ok = await a.run(p ? sb.from("patrimonio").update(d).eq("id", p.id) : sb.from("patrimonio").insert(d), "Patrimônio salvo");

      <label>Local</label><input value=${f.local || ""} onInput=${set("local")} placeholder="Ex.: Rack do som" />

      <button class="btn" style="width:100%;margin-top:14px">Salvar</button>
    </form>

function PatrimonioDetalhe({ p, onClose }) {

    ` : html`
      <input placeholder="Buscar pessoa…" value=${busca} onInput=${e => setBusca(e.target.value)} style="margin-bottom:10px" />
      ${a.profiles.filter(p => p.nome.toLowerCase().includes(busca.toLowerCase())).map(p => html`<div class="card" key=${p.id}>
        <div class="row between"><div><b>${p.nome}</b>${p.telefone && html`<div class="mut">${p.telefone}</div>`}
          <div class="mut">${a.membros.filter(x => x.profile_id === p.id).map(x => a.ministerios.find(m => m.id === x.ministerio_id)?.nome).filter(Boolean).join(", ")}</div></div>
          ${a.isAdmin && p.id !== a.uid ? html`<select style="width:auto" value=${p.papel} onChange=${e => a.run(sb.from("profiles").update({ papel: e.target.value }).eq("id", p.id), "Papel alterado")}>
            ${Object.entries(PAPEIS).map(([k, v]) => html`<option value=${k}>${v}</option>`)}</select>` : html`<${Chip} k=${p.papel} map=${PAPEIS} />`}
        </div></div>`)}
      ${a.isAdmin && html`<p class="mut">Líderes podem criar eventos, montar programas e cuidar do patrimônio. O líder de cada equipe monta a escala dela.</p>`}
    `}
    ${editMin && html`<${MinisterioForm} m=${editMin} onClose=${() => setEditMin(null)} />`}
  `;
}

function MinisterioCard({ m, onEdit }) {
  const a = useApp();
  const membros = a.membros.filter(x => x.ministerio_id === m.id);
  const [add, setAdd] = useState(""); const [funcao, setFuncao] = useState("");
  const pode = a.lidera(m.id);
  const fora = a.profiles.filter(p => !membros.some(x => x.profile_id === p.id));
  async function adicionar(e) { e.preventDefault(); if (!add) return; if (await a.run(sb.from("ministerio_membros").insert({ ministerio_id: m.id, profile_id: add, funcao: funcao || null }), "Adicionado à equipe")) { setAdd(""); setFuncao(""); } }
  return html`<div class="card">
    <div class="row between"><h3 style="margin:0">${m.nome}</h3>${a.isAdmin && html`<button class="btn sec sm" onClick=${onEdit}>Editar</button>`}</div>
    <div class="mut">Líder: ${m.lider_id ? a.nome(m.lider_id) : "não definido"}${m.descricao ? " · " + m.descricao : ""}</div>
    <div style="margin-top:8px">${membros.length === 0 ? html`<span class="mut">Sem membros.</span>` : membros.map(x => html`<div class="row between" key=${x.profile_id} style="padding:4px 0">
      <span>${a.nome(x.profile_id)}${x.funcao && html`<span class="mut"> · ${x.funcao}</span>`}</span>
      ${pode && html`<button class="ib" onClick=${() => a.run(sb.from("ministerio_membros").delete().eq("ministerio_id", m.id).eq("profile_id", x.profile_id))}>✕</button>`}</div>`)}</div>
    ${pode && html`<form class="row" onSubmit=${adicionar} style="margin-top:8px">
      <select value=${add} onChange=${e => setAdd(e.target.value)}><option value="">+ adicionar pessoa</option>${fora.map(p => html`<option value=${p.id}>${p.nome}</option>`)}</select>
      ${add && html`<input value=${funcao} onInput=${e => setFuncao(e.target.value)} placeholder="Função" style="max-width:130px" /><button class="btn sm">OK</button>`}
    </form>`}
  </div>`;
}

function MinisterioForm({ m, onClose }) {
  const a = useApp();
  const [f, setF] = useState({ nome: m.nome || "", descricao: m.descricao || "", lider_id: m.lider_id || "" });
  async function salvar(e) {
    e.preventDefault();
    const d = { nome: f.nome, descricao: f.descricao || null, lider_id: f.lider_id || null };
    if (await a.run(m.id ? sb.from("ministerios").update(d).eq("id", m.id) : sb.from("ministerios").insert(d), "Equipe salva")) onClose();
  }
  async function excluir() { if (confirm("Excluir esta equipe e suas escalas?") && await a.run(sb.from("ministerios").delete().eq("id", m.id), "Equipe excluída")) onClose(); }
  return html`<${Sheet} title=${m.id ? "Editar equipe" : "Nova equipe"} onClose=${onClose}>
    <form class="card" onSubmit=${salvar}>
      <label>Nome</label><input required value=${f.nome} onInput=${e => setF({ ...f, nome: e.target.value })} />
      <label>Descrição</label><input value=${f.descricao} onInput=${e => setF({ ...f, descricao: e.target.value })} />
      <label>Líder (monta a escala desta equipe)</label><select value=${f.lider_id} onChange=${e => setF({ ...f, lider_id: e.target.value })}><option value="">—</option>${a.profiles.map(p => html`<option value=${p.id}>${p.nome}</option>`)}</select>
      <button class="btn" style="width:100%;margin-top:14px">Salvar</button>
      ${m.id && html`<button type="button" class="btn err" style="width:100%;margin-top:8px" onClick=${excluir}>Excluir equipe</button>`}
    </form>
  </${Sheet}>`;
}

/* ---------- perfil ---------- */
function Perfil() {
  const a = useApp();
  const [f, setF] = useState({ nome: a.me.nome, telefone: a.me.telefone || "" });
  const salvar = e => { e.preventDefault(); a.run(sb.from("profiles").update({ nome: f.nome, telefone: f.telefone || null }).eq("id", a.uid), "Perfil salvo"); };
  const [apar, setApar] = useState(false);
  return html`
    <form class="card" onSubmit=${salvar} style="margin-top:4px">
      <div class="row between"><h3 style="margin:0">Meus dados</h3><${Chip} k=${a.me.papel} map=${PAPEIS} /></div>
      <label>Nome</label><input required value=${f.nome} onInput=${e => setF({ ...f, nome: e.target.value })} />
      <label>Telefone / WhatsApp</label><input value=${f.telefone} onInput=${e => setF({ ...f, telefone: e.target.value })} inputmode="tel" />
      <button class="btn" style="width:100%;margin-top:14px">Salvar</button>
    </form>
    <div class="card"><div class="mut">Minhas equipes</div><div>${a.membros.filter(x => x.profile_id === a.uid).map(x => a.ministerios.find(m => m.id === x.ministerio_id)?.nome).join(", ") || "Nenhuma ainda — peça ao líder para te adicionar."}</div></div>
    ${a.isAdmin && html`<div class="card"><h3>Aparência do PDF</h3><div class="mut" style="margin-bottom:8px">Estilo, cores e logo do programa impresso. Para ver o resultado enquanto ajusta, abra um evento, clique em "Gerar PDF" e depois em "Aparência".</div>
      <button class="btn sec" onClick=${() => setApar(true)}>Configurar</button></div>`}
    ${apar && html`<${AparenciaForm} onClose=${() => setApar(false)} />`}
    <button class="btn err" style="width:100%" onClick=${() => sb.auth.signOut()}>Sair</button>
  `;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
